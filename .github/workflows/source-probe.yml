name: Manual source capability probe

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.12.23"
          enable-cache: true
      - run: uv python install 3.12.14
      - run: uv sync --locked
      - name: Bounded CDN probes and repeat of successful observations
        run: >-
          uv run --locked python -m hoop.domains.nba.sources.probe
          --environment github-actions --config configs/sources/cloud.json
          --archive artifacts/source-cloud
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Retain raw evidence and failure reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-evidence-${{ github.run_id }}
          path: artifacts/source-cloud/
          retention-days: 14
          if-no-files-found: error
