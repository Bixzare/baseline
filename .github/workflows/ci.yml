name: Bootstrap CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_probe:
        description: "Run bounded live CDN probes and retain evidence (manual only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bootstrap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manual-source-probe:
    if: github.event_name == 'workflow_dispatch' && inputs.source_probe
    uses: ./.github/workflows/source-probe.yml

  linux:
    name: Linux lint, types, tests, and kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.12.23"
          enable-cache: true
      - run: uv python install 3.12.14
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy src scripts/check_boundaries.py
      - run: uv run --locked python scripts/check_boundaries.py
      - run: uv run --locked pytest
      - run: uv build --no-sources
      - name: Register project kernel
        run: uv run --locked python -m ipykernel install --sys-prefix --name baseline --display-name "Baseline (Python 3.12)"
      - run: uv run --locked python scripts/check_kernel.py
      - name: Verify tracked files were not changed
        run: git diff --exit-code

  windows:
    name: Windows imports, paths, and kernel
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.12.23"
          enable-cache: true
      - run: uv python install 3.12.14
      - run: uv sync --locked
      - run: uv run --locked pytest
      - name: Register project kernel
        run: uv run --locked python -m ipykernel install --sys-prefix --name baseline --display-name "Baseline (Python 3.12)"
      - run: uv run --locked python scripts/check_kernel.py
      - name: Verify tracked files were not changed
        run: git diff --exit-code
