name: Manual private artifact permissions
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: artifact-rehearsal
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          version: "0.12.23"
      - run: uv python install 3.12.14
      - run: uv sync --locked
      - run: uv run --locked python -m hoop.platform.artifacts verify
        env:
          BASELINE_SUPABASE_URL: ${{ vars.BASELINE_SUPABASE_URL }}
          BASELINE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.BASELINE_SUPABASE_PUBLISHABLE_KEY }}
          BASELINE_ARTIFACT_USER_ID: ${{ vars.BASELINE_ARTIFACT_USER_ID }}
          BASELINE_ARTIFACT_BUCKET: ${{ vars.BASELINE_ARTIFACT_BUCKET }}
          BASELINE_ARTIFACT_EMAIL: ${{ secrets.BASELINE_ARTIFACT_EMAIL }}
          BASELINE_ARTIFACT_PASSWORD: ${{ secrets.BASELINE_ARTIFACT_PASSWORD }}
          BASELINE_OTHER_ARTIFACT_USER_ID: ${{ vars.BASELINE_OTHER_ARTIFACT_USER_ID }}
          BASELINE_OTHER_ARTIFACT_BUCKET: ${{ vars.BASELINE_OTHER_ARTIFACT_BUCKET }}
          BASELINE_OTHER_ARTIFACT_EMAIL: ${{ secrets.BASELINE_OTHER_ARTIFACT_EMAIL }}
          BASELINE_OTHER_ARTIFACT_PASSWORD: ${{ secrets.BASELINE_OTHER_ARTIFACT_PASSWORD }}
