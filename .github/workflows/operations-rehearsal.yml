name: Disposable operation rehearsal
on:
  workflow_call:
    inputs:
      operation:
        type: string
        required: true
      fail_stage:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
        env:
          POSTGRES_PASSWORD: baseline_fixture_only
          POSTGRES_DB: baseline_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d baseline_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BASELINE_TEST_DSN: postgresql://postgres:baseline_fixture_only@127.0.0.1:5432/baseline_test
      OPERATION: ${{ inputs.operation }}
      FAIL_STAGE: ${{ inputs.fail_stage }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.12.23"
          enable-cache: true
      - run: uv python install 3.12.14
      - run: uv sync --locked
      - name: Exercise actual stage adapters with invented source responses
        shell: bash
        run: |
          arguments=(--operation "$OPERATION" --environment github-actions)
          if [[ "$FAIL_STAGE" == "true" ]]; then arguments+=(--fail-stage); fi
          uv run --locked python -m scripts.rehearse_operations "${arguments[@]}"
